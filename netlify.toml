[build]
  base = "apps/web"
  command = "npm install --ignore-scripts && npm run build"
  publish = "dist"

# হ্যাশ-করা বান্ডল/অ্যাসেট (index-*.js, index-*.css, লোগো) — ফাইলের
# নামে হ্যাশ থাকে বলে কখনো বদলায় না; তাই ব্রাউজার যাতে বারবার
# না চায়, এক বছরের immutable ক্যাশ। index.html এতে নেই — ওটা
# প্রতিবার নতুন করে আসাই ঠিক (নতুন বান্ডলের নাম ওখানেই থাকে)।
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — /<shop>/<product> লিংক যাতে সরাসরি খোলে
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
